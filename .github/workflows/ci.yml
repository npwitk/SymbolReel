name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Render smoke test
        run: |
          swift run symbolreel wifi -e variable-color.iterative -f prores,mp4,png -o exports
          ls -la exports
